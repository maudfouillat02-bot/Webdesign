===================================================== -->

<section id="loginScreen" class="login-screen">

        <div class="logo">
            ZAG
        </div>

        <span class="eyebrow">
            ZAG SERVICE
        </span>

        <h1>
            Serveur
        </h1>

        <p>
            Accédez à votre espace d'administration.
        </p>

            <label for="adminEmail">
                Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Votre email"
                required
            >

            <label for="adminPassword">
                Mot de passe
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Votre mot de passe"

            >

            <button type="submit">
                Se connecter
            </button>

            <div id="loginMessage"></div>

        </form>

    </div>

</section>

===================================================== -->

                Traitées

            <strong id="doneCount">

            </strong>
        </div>

    </section>

                Nouveau
