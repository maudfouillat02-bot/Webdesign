name: Build ZAG SERVICE APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier Java
        run: |
          java -version
          javac -version

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser Capacitor Android
        run: npx cap sync android

      - name: Donner les permissions au Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Vérifier Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Construire l'APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: zag-service-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
